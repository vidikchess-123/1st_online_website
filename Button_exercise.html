<!DOCTYPE html>
<html>
    <head>
        <title>Amazon</title>
        <style>
            .link-to-amazon{
                color: rgb(0,113,133);
            }
            .in-stock{
                color:rgb(0,118,0)
            }
            .Add-To-Cart{
                background-color: rgb(255, 216, 20);
                height: 35px;
                width: 130px;
                border-radius: 15px;
                cursor: pointer;
                border: none;
                font-weight: 500;
                font-size: 16px;
                margin-right: 13px;
            }
            .Buy-now{
                background-color: rgb(255, 164, 28 );
                height: 35px;
                width: 130px;
                border-radius: 15px;
                cursor: pointer;
                border: none;
                font-weight: 500;
                font-size: 16px;

            }
            h3{
                font-weight:lighter;
            }
        </style>
    </head>
    <body>
       <a href="" target="_blank" class="link-to-amazon">
        Back to Amazon
       </a> 
       <h1>
        <strong>
            Nike Black Running Shoes
        </strong>
       </h1>
       <h3 class="in-stock">
        $39 - in stock.
       </h3>
       <h3>
        <strong>
        Free delivery tommorrow.
        </strong>
       </h3>
       <button class="Add-To-Cart">
        Add to Cart
       </button>
       <button class="Buy-now">
        Buy now
       </button>
    </body>
</html>
